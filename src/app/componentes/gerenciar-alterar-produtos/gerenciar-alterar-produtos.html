<main class="container">

  <section class="form-section">

    <div class="form-card">

      <h1>Alterar Produto</h1>

      <form>
        <div class="input-group">
          <label>Nome</label>
          <input type="text" [(ngModel)]="produto.nome" name="nome">

          <label>Marca</label>
          <input type="text" [(ngModel)]="produto.marca" name="marca">

          <label>Categoria</label>
          <input type="text" [(ngModel)]="produto.categoria" name="categoria">

          <label>Modelo</label>
          <input type="text" [(ngModel)]="produto.modelo" name="modelo">

          <label>Preço</label>
          <input type="number" [(ngModel)]="produto.preco" name="preco">

          <label>Estoque</label>
          <input type="number" [(ngModel)]="produto.estoque" name="estoque">

          <label>Status</label>
          <input type="text" [(ngModel)]="produto.status" name="status">

          <label>Descrição</label>
          <input type="text" [(ngModel)]="produto.descricao" name="descricao">

          <label for="imagem">URL da Imagem</label>
          <input
            type="text"
            name="imagem"
            id="imagem"
            [(ngModel)]="produto.imagem"
            placeholder="Cole a URL da imagem aqui"
          >

          <!-- Prévia da imagem -->
          <img *ngIf="produto.imagem" [src]="produto.imagem" alt="Imagem do produto" style="max-width: 120px; margin-top: 10px;">
        </div>
      </form>

      <div class="form-actions">
        <button class="btn-primary" (click)="editarProduto()">Salvar Alteração</button>
      </div>

    </div>

  </section>

</main>
