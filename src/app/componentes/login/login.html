<div class="overlay"></div>

<div class="formulario">
    <h1>Login</h1>
    <form id="loginForm" (ngSubmit)="entrar()">
        <div class="caixa-formulario">
            <input type="text" id="username" name="username" placeholder="  Nome de usuario" [(ngModel)]="usuario" required>
            <i class="bx bxs-user"></i>
        </div>

        <div class="caixa-formulario">
            <input type="password" id="password" name="password" placeholder="  Senha" [(ngModel)]="senha" required>
            <i class="bx bxs-lock-alt"></i>
        </div>

        <div class="caixa-lembrar-esqueci">
            <label><input type="checkbox"> Lembrar </label>
            <a href="#"> Esqueci minha senha</a>
        </div>

        <button type="submit">Entrar</button>

        <div class="link-registro">
            <p>Nao tem conta? <a href="#"> Cadastre-se</a></p>
        </div>

        <div class="mensagem-login">{{ mensagem }}</div>
    </form>
</div>
