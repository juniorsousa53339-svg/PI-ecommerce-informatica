<div class="login-container">
  <div class="login-box">
    <h1>TechStore</h1>
    <p class="subtitle">Faça login para continuar</p>

    <div class="info-box">
      <p><strong>Admin:</strong> Nome: admin | Senha: 12345</p>
      <p><strong>Usuário:</strong> Nome: (qualquer) | Senha: 54321</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          [(ngModel)]="nome"
          name="nome"
          placeholder="Digite seu nome"
          class="input-field"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha:</label>
        <input
          type="password"
          id="senha"
          [(ngModel)]="senha"
          name="senha"
          placeholder="Digite sua senha"
          class="input-field"
        />
      </div>

      <div *ngIf="erro" class="erro-message">
        {{ erro }}
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
