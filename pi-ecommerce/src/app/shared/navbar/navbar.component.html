<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <h1>TechStore</h1>
    </div>

    <div class="navbar-menu">
      <div class="nav-links">
        <a routerLink="/produtos" class="nav-link">Produtos</a>
        <a
          *ngIf="ehAdmin()"
          routerLink="/gerenciar-produtos"
          class="nav-link admin-link"
        >
          Gerenciar Produtos
        </a>
      </div>

      <div class="user-info" *ngIf="usuario$ | async as usuario">
        <span class="user-name">{{ usuario.nome }}</span>
        <span class="user-type" [class.admin]="usuario.tipo === 'admin'">
          {{ usuario.tipo === 'admin' ? 'ADMIN' : 'Usuário' }}
        </span>
        <button (click)="logout()" class="btn-logout">Sair</button>
      </div>
    </div>
  </div>
</nav>
